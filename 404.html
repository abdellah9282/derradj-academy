  <meta charset="UTF-8" />

  <title>الصفحة غير موجودة — Derradj Academy</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="/Logo.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #faf7fc;
      color: #2b2b2b;
      font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #eee2f5;
      border-radius: 16px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(106, 27, 154, 0.12);
    }

    .code {
      font-size: 3.5rem;
      font-weight: 800;
      color: #6a1b9a;
      line-height: 1;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    p {
      font-size: 1rem;
      color: #666;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .home-btn {
      display: inline-block;
      background: #6a1b9a;
      color: #fff;
      text-decoration: none;
      padding: 13px 32px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.2s;
    }

    .home-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .logo-text {
      margin-top: 36px;
      font-size: 0.8rem;
      color: #999;
    }

    .logo-text span {
      color: #6a1b9a;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p>عذرًا، الرابط الذي حاولت الوصول إليه غير موجود أو تم نقله.</p>
    <a href="/" class="home-btn">العودة إلى الصفحة الرئيسية</a>
    <p class="logo-text"><span>D</span>erradj Academy</p>
  </div>
</body>
