# ══════════════════════════════════════════════════════
# netlify.toml — Derradj Academy
# ══════════════════════════════════════════════════════

[build]
  publish = "."

# ─── Canonical URL enforcement ────────────────────────
# Disable Netlify's legacy "Pretty URLs" post-processing, which
# auto-aliases every foo.html file to also be served at /foo.
# That aliasing is what let /courses/algebre2 resolve as a silent
# 200 duplicate of /courses/algebre2.html, and made Netlify's own
# trailing-slash normalization 301 to the extension-less form
# instead of the .html canonical declared in sitemap.xml, robots.txt
# and every <link rel="canonical">. With this off, only the literal
# .html files are served directly; extension-less access goes
# through the explicit 301 rules in _redirects.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# ─── Security Headers (نسخة احتياطية من _headers) ───

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    X-XSS-Protection        = "1; mode=block"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/mycourses-board/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    X-Robots-Tag            = "noindex, nofollow, nosnippet, noarchive"
    Cache-Control           = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma                  = "no-cache"

[[headers]]
  for = "/login/*"
  [headers.values]
    X-Frame-Options  = "DENY"
    Cache-Control    = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma           = "no-cache"

# ─── Redirects ───────────────────────────────────────
# ملاحظة: localStorage لا يمكن قراءته server-side
# لذا لا يمكننا إعادة التوجيه بناءً على الجلسة من هنا.
# التحقق من الجلسة يبقى في JavaScript (course.js).

# Canonical host: apex → www (was previously in the unused _netlify.toml,
# which Netlify never actually reads — only netlify.toml at repo root is
# parsed — so this redirect was not live in production before).
[[redirects]]
  from   = "https://derradjacademy.com/*"
  to     = "https://www.derradjacademy.com/:splat"
  status = 301
  force  = true

# أي طلب لصفحة غير موجودة → صفحة 404 حقيقية (وليست الصفحة الرئيسية)
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
